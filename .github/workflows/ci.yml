name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  xslt-wrapper-controls:
    name: XSLT wrapper controls (Windows)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build conformance runner
        run: dotnet build tests/Bosak.Xslt.Conformance -c Release
      - name: Verify successful, failing, empty and timed-out receipts
        shell: powershell
        run: ./tests/Bosak.Xslt.Conformance/verify-wrapper.ps1
      - name: Retain wrapper evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xslt-wrapper-controls
          include-hidden-files: true
          path: .artifacts/
  build-and-test:
    name: Build & test (net10.0)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with test-suite submodules — unit tests read qt3tests schema fixtures)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Bosak.sln

      - name: Build
        run: dotnet build Bosak.sln -c Release --no-restore

      - name: Runner processor-profile controls
        shell: pwsh
        run: ./tests/Bosak.Xslt.Conformance/verify-runner-profile.ps1

      - name: Test
        run: dotnet test Bosak.sln -c Release --no-build --logger trx --results-directory TestResults

      - name: Language-server tests
        run: dotnet test tests/Bosak.LanguageServer.Tests -c Release --logger trx --results-directory TestResults

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          include-hidden-files: true
          path: |
            TestResults
            .artifacts/runner-profile-smoke
          retention-days: 14

  extension-highlighting:
    name: VS Code highlighting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: vscode-bosak/package-lock.json
      - name: Compile and verify TextMate highlighting
        working-directory: vscode-bosak
        run: |
          npm ci
          npm run compile
          npm test
