name: Conformance sweep

on:
  schedule:
    # Weekly, Sunday 05:17 UTC
    - cron: '17 5 * * 0'
  workflow_dispatch:

jobs:
  sweep:
    name: W3C XSLT 3.0 + QT3 conformance sweep
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with test-suite submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fetch xslt30-test suite (not a submodule; gitignored locally)
        run: git clone --depth 1 https://github.com/w3c/xslt30-test.git tests/xslt30-test

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build Bosak.sln -c Release

      - name: XSLT 3.0 strict sweep
        # Note: Bosak.Xslt.Conformance.Main is void and always exits 0;
        # regressions are read from the uploaded log summary.
        run: dotnet run -c Release --no-build --project tests/Bosak.Xslt.Conformance -- tests/xslt30-test/catalog.xml 2>&1 | tee xslt-sweep.log

      - name: QT3 sweep
        run: dotnet run -c Release --no-build --project tests/Bosak.XPath.Conformance -- tests/qt3tests 2>&1 | tee qt3-sweep.log

      - name: Upload sweep logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-sweep
          path: |
            xslt-sweep.log
            qt3-sweep.log
          retention-days: 30
